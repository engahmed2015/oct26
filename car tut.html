<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Motor RC Car Circuit Tutor</title>
  <style>
    :root {
      --bg: #1a1b24;
      --board: #252836;
      --pos-color: #e63946;
      --neg-color: #00b4d8;
      --border-color: #3f4258;
      --motor-yellow: #ffd166;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      background-color: var(--bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 6px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #f7fff7;
    }

    /* Guide Panel */
    .guide-panel {
      width: 1050px;
      background: #2b2d42;
      border: 2px solid #4a4e69;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transition: border-color 0.3s, background 0.3s;
    }

    .guide-panel.error-state {
      border-color: #ff3366;
      background: #381e28;
    }

    .guide-text-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guide-avatar {
      font-size: 2rem;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .guide-msg {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffdf00;
      margin: 0;
    }

    .guide-panel.error-state .guide-msg {
      color: #ff4d6d;
    }

    .guide-sub {
      font-size: 0.82rem;
      color: #a0aab2;
      margin: 2px 0 0 0;
    }

    .guide-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-speak {
      background: #3a86ff;
      border: none;
      color: white;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-speak:hover { background: #2563eb; }

    .btn-reset {
      background: #e63946;
      border: none;
      color: white;
      padding: 7px 18px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-reset:hover { background: #d62828; }

    /* Workspace */
    #workspace {
      position: relative;
      width: 1050px;
      height: 600px;
      background: var(--board);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--border-color);
      overflow: hidden;
    }

    #workspace.scissor-mode, #workspace.scissor-mode * {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><text y="20" font-size="20">✂️</text></svg>') 4 16, crosshair !important;
    }

    #wires-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .wire-path {
      stroke-width: 4.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke-width 0.2s, filter 0.2s;
    }

    .wire-path.locked {
      pointer-events: none;
      cursor: default;
    }

    .wire-path.cuttable {
      pointer-events: stroke !important;
      cursor: pointer;
    }

    .wire-path.cuttable:hover {
      stroke-width: 8px;
      filter: drop-shadow(0 0 12px #ffbe0b);
    }

    .wire-path.can-remove {
      pointer-events: stroke !important;
      cursor: pointer !important;
    }

    .wire-path.can-remove:hover {
      stroke-width: 8px;
      filter: drop-shadow(0 0 10px #fff);
    }

    .wire-path.pos {
      stroke: var(--pos-color);
      filter: drop-shadow(0 0 4px rgba(230, 57, 70, 0.5));
    }

    .wire-path.neg {
      stroke: var(--neg-color);
      filter: drop-shadow(0 0 4px rgba(0, 180, 216, 0.5));
    }

    .wire-path.short {
      stroke: #ffd166;
      stroke-dasharray: 8 4;
      animation: dash 1s linear infinite;
      filter: drop-shadow(0 0 8px #ff9e00);
    }

    .wire-path.wrong-step {
      stroke: #ff0055 !important;
      stroke-dasharray: 6 6;
      animation: dash 0.6s linear infinite;
      filter: drop-shadow(0 0 10px #ff0055) !important;
    }

    @keyframes dash {
      to { stroke-dashoffset: -24; }
    }

    .temp-wire {
      stroke-width: 3px;
      stroke-dasharray: 6 4;
      stroke-linecap: round;
      fill: none;
    }

    .guide-pointer {
      position: absolute;
      width: 0; 
      height: 0; 
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 20px solid #ff0055;
      filter: drop-shadow(0 0 8px #ff0055);
      z-index: 50;
      pointer-events: none;
      display: none;
      animation: bounceArrow 0.6s infinite alternate ease-in-out;
    }

    @keyframes bounceArrow {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    /* Nodes (Terminals) */
    .node {
      width: 26px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .node-pos {
      background: rgba(230, 57, 70, 0.25);
      border: 2px solid var(--pos-color);
      color: var(--pos-color);
    }

    .node-neg {
      background: rgba(0, 180, 216, 0.25);
      border: 2px solid var(--neg-color);
      color: var(--neg-color);
    }

    .node:hover { transform: scale(1.25); }

    .node.selected {
      transform: scale(1.3);
      box-shadow: 0 0 15px #fff;
      background: #fff;
      color: #000;
    }

    .node.target-hint {
      animation: targetGlow 0.8s infinite alternate;
      border-color: #ffdf00 !important;
    }

    @keyframes targetGlow {
      0% { box-shadow: 0 0 5px #ffdf00; }
      100% { box-shadow: 0 0 20px #ffdf00, 0 0 35px #ff0055; }
    }

    /* Battery - Vertical */
    .battery-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 8;
    }

    .battery-body {
      width: 58px;
      height: 140px;
      background: #111317;
      border: 3px solid #ffffff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      position: relative;
      overflow: visible;
      transition: all 0.3s;
    }

    .battery-cell {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .cell-neg { background: #0077b6; color: #fff; border-radius: 4px 4px 0 0; }
    .cell-pos { background: #d90429; color: #fff; border-radius: 0 0 4px 4px; }

    .battery-burned {
      background: #250909 !important;
      border-color: #ff3300 !important;
      box-shadow: 0 0 40px #ff2200, 0 0 70px #ff7700 !important;
      animation: shake 0.2s infinite alternate;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      100% { transform: translate(-1px, -2px) rotate(-1deg); }
    }

    .flame-icon {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      display: none;
      animation: flicker 0.3s infinite alternate;
      pointer-events: none;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) translateY(0); filter: drop-shadow(0 0 10px #ff5400); }
      100% { transform: translateX(-50%) scale(1.15) translateY(-5px); filter: drop-shadow(0 0 25px #ffdd00); }
    }

    .battery-burned .flame-icon { display: block; }

    /* Switches */
    .switch-wrapper {
      position: absolute;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 15;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .switch-box {
      width: 75px;
      height: 44px;
      background: rgba(22, 23, 30, 0.95);
      border: 2px solid #5a5d7a;
      border-radius: 6px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }

    .switch-box:hover {
      border-color: #ffbe0b;
      box-shadow: 0 0 10px rgba(255, 190, 11, 0.4);
    }

    .switch-box.bypassed {
      border-color: #e63946;
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.6);
    }

    .switch-box.bypassed::after {
      content: '✕';
      position: absolute;
      font-size: 1.8rem;
      font-weight: 900;
      color: rgba(230, 57, 70, 0.8);
      pointer-events: none;
    }

    .switch-svg { width: 60px; height: 36px; }
    .switch-contact { fill: #ffbe0b; }
    .switch-lever {
      stroke: #00b4d8;
      stroke-width: 3.5px;
      stroke-linecap: round;
      transform-origin: 18px 23px;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .switch-box.closed .switch-lever {
      transform: rotate(24deg);
      stroke: #06d6a0;
    }

    .switch-label {
      position: absolute;
      bottom: 2px;
      font-size: 0.6rem;
      color: #a0a4b8;
      font-weight: bold;
    }

    /* Comic Speech Bubbles */
    .comic-bubble {
      position: absolute;
      bottom: 55px;
      left: 50%;
      transform: translateX(-50%) scale(0.6);
      background: #fff;
      color: #111;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      border: 2px solid #111;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 25;
    }

    .comic-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 7px 7px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }

    .comic-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Car Chassis */
    .chassis {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 470px;
      height: 350px;
      background: #532d18;
      border-radius: 20px;
      border: 4px solid #7c4224;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.7), 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      justify-content: space-between;
      padding: 20px 10px;
      transition: transform 0.4s ease;
    }

    .chassis.moving-forward {
      transform: translateX(-50%) translateY(-18px);
      box-shadow: 0 15px 35px rgba(6, 214, 160, 0.4);
    }
    .chassis.turning-left {
      transform: translateX(-50%) rotate(-6deg);
    }
    .chassis.turning-right {
      transform: translateX(-50%) rotate(6deg);
    }

    .caster-wheel {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 48px;
      background: #e2eafc;
      border-radius: 12px;
      border: 3px solid #6c757d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .motor-assembly {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .motor-body {
      width: 80px;
      height: 180px;
      background: #ffd166;
      border: 3.5px solid #b78a00;
      border-radius: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #333;
      font-size: 0.95rem;
      box-shadow: 0 5px 12px rgba(0,0,0,0.4);
    }

    .motor-body::before {
      content: '';
      position: absolute;
      top: -14px;
      width: 36px;
      height: 14px;
      background: #adb5bd;
      border: 2px solid #495057;
      border-radius: 5px 5px 0 0;
    }

    .wheel {
      width: 34px;
      height: 145px;
      background: #111;
      border: 3px solid #f77f00;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      box-shadow: 0 5px 12px rgba(0,0,0,0.6);
    }

    .tire-thread {
      width: 100%;
      height: 9px;
      background: #333;
    }

    .wheel.spinning .tire-thread {
      animation: wheelRoll 0.2s linear infinite;
    }

    @keyframes wheelRoll {
      0% { transform: translateY(-9px); }
      100% { transform: translateY(9px); }
    }

    .motor-terminals-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 150px;
      z-index: 12;
    }
  </style>
</head>
<body>

  <header>
    <h1>2-Motor RC Car Circuit Tutor</h1>
  </header>

  <!-- Coach / Guidance Panel -->
  <div class="guide-panel" id="guide-panel">
    <div class="guide-text-area">
      <div class="guide-avatar" id="guide-avatar">👨‍🏫</div>
      <div>
        <div class="guide-msg" id="guide-title">Welcome! Let's build the 2-motor robot car.</div>
        <div class="guide-sub" id="guide-desc">Follow the coach instructions and connect the target terminals.</div>
      </div>
    </div>
    <div class="guide-buttons">
      <button class="btn-speak" id="btn-repeat">🔊 Repeat Voice</button>
      <button class="btn-reset" id="clear-btn">Reset Project</button>
    </div>
  </div>

  <div id="workspace">
    <div id="arrow-1" class="guide-pointer"></div>
    <div id="arrow-2" class="guide-pointer"></div>

    <svg id="wires-layer">
      <path id="temp-line" class="temp-wire" d=""></path>
    </svg>

    <!-- Battery -->
    <div class="battery-container">
      <div class="node node-neg" id="bat_neg" data-polarity="neg" data-parent="battery" title="Battery Negative (-)">-</div>
      <div class="battery-body" id="battery-body">
        <div class="flame-icon">🔥</div>
        <div class="battery-cell cell-neg">-</div>
        <div class="battery-cell cell-pos">+</div>
      </div>
      <div class="node node-pos" id="bat_pos" data-polarity="pos" data-parent="battery" title="Battery Positive (+)">+</div>
    </div>

    <!-- Left Motor Switch (SW L) -->
    <div class="switch-wrapper" id="sw-wrap-1" style="left: 170px; top: 120px;">
      <div class="comic-bubble" id="bubble-sw1">You bypassed me! 😅</div>
      <div class="node node-neg" id="sw1_in" data-polarity="neg" data-parent="sw1" title="Left Switch Negative Input (-)">-</div>
      <div class="switch-box" id="sw1_box" title="Click to Toggle Left Switch">
        <svg class="switch-svg" viewBox="0 0 60 36">
          <circle class="switch-contact" cx="18" cy="23" r="3.5" />
          <circle class="switch-contact" cx="44" cy="23" r="3.5" />
          <line class="switch-lever" x1="18" y1="23" x2="43" y2="10" />
        </svg>
        <span class="switch-label">SW L</span>
      </div>
      <div class="node node-neg" id="sw1_out" data-polarity="neg" data-parent="sw1" title="Left Switch Negative Output (-)">-</div>
    </div>

    <!-- Right Motor Switch (SW R) -->
    <div class="switch-wrapper" id="sw-wrap-2" style="right: 170px; top: 120px;">
      <div class="comic-bubble" id="bubble-sw2">You bypassed me! 😅</div>
      <div class="node node-neg" id="sw2_in" data-polarity="neg" data-parent="sw2" title="Right Switch Negative Input (-)">-</div>
      <div class="switch-box" id="sw2_box" title="Click to Toggle Right Switch">
        <svg class="switch-svg" viewBox="0 0 60 36">
          <circle class="switch-contact" cx="18" cy="23" r="3.5" />
          <circle class="switch-contact" cx="44" cy="23" r="3.5" />
          <line class="switch-lever" x1="18" y1="23" x2="43" y2="10" />
        </svg>
        <span class="switch-label">SW R</span>
      </div>
      <div class="node node-neg" id="sw2_out" data-polarity="neg" data-parent="sw2" title="Right Switch Negative Output (-)">-</div>
    </div>

    <!-- Car Chassis -->
    <div class="chassis" id="car-chassis">
      <div class="caster-wheel" title="Front Caster Wheel"></div>

      <!-- Left Motor (M1) -->
      <div class="motor-assembly" id="assembly-m1">
        <div class="comic-bubble" id="bubble-m1">Where is the power? 🤔</div>
        <div class="wheel" id="wheel-left">
          <div class="tire-thread"></div><div class="tire-thread"></div><div class="tire-thread"></div>
          <div class="tire-thread"></div><div class="tire-thread"></div>
        </div>
        <div class="motor-body">MOTOR L</div>
        <div class="motor-terminals-col">
          <div class="node node-neg" id="m1_neg" data-polarity="neg" data-parent="m1" title="Motor L Negative (-)">-</div>
          <div class="node node-pos" id="m1_pos" data-polarity="pos" data-parent="m1" title="Motor L Positive (+)">+</div>
        </div>
      </div>

      <!-- Right Motor (M2) -->
      <div class="motor-assembly" id="assembly-m2">
        <div class="comic-bubble" id="bubble-m2">Where is the power? 🤔</div>
        <div class="motor-terminals-col">
          <div class="node node-neg" id="m2_neg" data-polarity="neg" data-parent="m2" title="Motor R Negative (-)">-</div>
          <div class="node node-pos" id="m2_pos" data-polarity="pos" data-parent="m2" title="Motor R Positive (+)">+</div>
        </div>
        <div class="motor-body">MOTOR R</div>
        <div class="wheel" id="wheel-right">
          <div class="tire-thread"></div><div class="tire-thread"></div><div class="tire-thread"></div>
          <div class="tire-thread"></div><div class="tire-thread"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const workspace = document.getElementById('workspace');
    const wiresLayer = document.getElementById('wires-layer');
    const tempLine = document.getElementById('temp-line');
    const clearBtn = document.getElementById('clear-btn');
    const nodes = document.querySelectorAll('.node');
    const batteryBody = document.getElementById('battery-body');
    const carChassis = document.getElementById('car-chassis');
    const wheelLeft = document.getElementById('wheel-left');
    const wheelRight = document.getElementById('wheel-right');

    const guidePanel = document.getElementById('guide-panel');
    const guideTitle = document.getElementById('guide-title');
    const guideDesc = document.getElementById('guide-desc');
    const guideAvatar = document.getElementById('guide-avatar');
    const btnRepeat = document.getElementById('btn-repeat');
    const arrow1 = document.getElementById('arrow-1');
    const arrow2 = document.getElementById('arrow-2');

    let selectedNode = null;
    let wires = [];
    let hasBlockingError = false;

    // Phases: 'wiring' -> 'cutting' -> 'switches'
    let currentPhase = 'wiring';
    let currentStep = 0;
    let cutStep = 1; // 1: cut Right neg, 2: cut Left neg
    let switchStep = 0;

    const switches = {
      sw1: { closed: false, box: document.getElementById('sw1_box'), wrap: document.getElementById('sw-wrap-1'), inNode: 'sw1_in', outNode: 'sw1_out' },
      sw2: { closed: false, box: document.getElementById('sw2_box'), wrap: document.getElementById('sw-wrap-2'), inNode: 'sw2_in', outNode: 'sw2_out' }
    };

    /* ================= Web Audio API & Speech ================= */
    let audioCtx = null;
    let alarmOsc = null, alarmGain = null, isAlarmPlaying = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function playSuccessSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.45);
    }

    function playErrorSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.28);
    }

    function playSnipSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'highpass';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.1);
    }

    function playClickSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.06);
    }

    function startAlarmSound() {
      if (isAlarmPlaying) return;
      try {
        initAudio();
        alarmOsc = audioCtx.createOscillator();
        alarmGain = audioCtx.createGain();
        alarmOsc.type = 'sawtooth';
        const now = audioCtx.currentTime;
        alarmOsc.frequency.setValueAtTime(650, now);
        let cycleTime = now;
        for (let i = 0; i < 40; i++) {
          alarmOsc.frequency.linearRampToValueAtTime(950, cycleTime + 0.25);
          alarmOsc.frequency.linearRampToValueAtTime(650, cycleTime + 0.5);
          cycleTime += 0.5;
        }
        alarmGain.gain.setValueAtTime(0.15, now);
        alarmOsc.connect(alarmGain);
        alarmGain.connect(audioCtx.destination);
        alarmOsc.start();
        isAlarmPlaying = true;
      } catch (err) {}
    }

    function stopAlarmSound() {
      if (!isAlarmPlaying) return;
      try {
        if (alarmGain && audioCtx) {
          alarmGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          setTimeout(() => {
            if (alarmOsc) { alarmOsc.stop(); alarmOsc.disconnect(); }
            isAlarmPlaying = false;
          }, 100);
        }
      } catch (e) { isAlarmPlaying = false; }
    }

    /* ================= Steps Sequence ================= */
    // 1. Right Motor, 2. Left Motor

      { text: "Connect positive (+) of battery to the positive (+) of the Right Motor.", n1: 'bat_pos', n2: 'm2_pos', desc: "Click the Red (+) terminal of the battery, then the Red (+) terminal of Motor R." },
      { text: "Connect negative (-) of battery to the negative (-) of the Right Motor.", n1: 'bat_neg', n2: 'm2_neg', desc: "Click the Blue (-) terminal of the battery, then the Blue (-) terminal of Motor R." },
      { text: "Connect positive (+) of battery to the positive (+) of the Left Motor.", n1: 'bat_pos', n2: 'm1_pos', desc: "Click the Red (+) terminal of the battery, then the Red (+) terminal of Motor L." },
      { text: "Connect negative (-) of battery to the negative (-) of the Left Motor.", n1: 'bat_neg', n2: 'm1_neg', desc: "Click the Blue (-) terminal of the battery, then the Blue (-) terminal of Motor L." }
    ];

    // Switches Steps: Negative side switches (SW R then SW L)
    const switchWiringSteps = [
      { text: "Connect negative (-) of battery to the input (-) of Right Switch.", n1: 'bat_neg', n2: 'sw2_in', desc: "Connect the battery negative to Switch R input." },
      { text: "Connect output (-) of Right Switch to the negative (-) of Right Motor.", n1: 'sw2_out', n2: 'm2_neg', desc: "Complete Switch R circuit to Motor R." },
      { text: "Click Switch R to test and turn the robot car!", isToggle: true, swKey: 'sw2' },

      { text: "Connect negative (-) of battery to the input (-) of Left Switch.", n1: 'bat_neg', n2: 'sw1_in', desc: "Connect the battery negative to Switch L input." },
      { text: "Connect output (-) of Left Switch to the negative (-) of Left Motor.", n1: 'sw1_out', n2: 'm1_neg', desc: "Complete Switch L circuit to Motor L." },
      { text: "Click Switch L to test both motors running together!", isToggle: true, swKey: 'sw1' }
    ];

    function getNodeCenter(nodeId) {
      const el = document.getElementById(nodeId);
      const wsRect = workspace.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      return {
        x: (rect.left + rect.width / 2) - wsRect.left,

    /* ================= Guidance UI Controller ================= */
    function updateGuidanceUI() {
      document.querySelectorAll('.node').forEach(n => n.classList.remove('target-hint'));

      } else if (currentPhase === 'switches') {

    btnRepeat.addEventListener('click', () => {
      if (hasBlockingError) {
        const errorWire = wires.find(w => w.isError);
        if (errorWire) {
          if (errorWire.isBatteryShort) {
            speak("Danger! Short circuit. Please click on the flashing wire to remove it.");
          } else if (errorWire.isMotorShort) {
            speak("Where is the energy? A motor cannot power itself. Please click the flashing wire to remove it.");
          } else if (errorWire.isSwitchBypass) {
            speak("You canceled me! The switch is bypassed and has no control. Click the wire to remove it.");
          } else {

          }
        }
      } else if (currentPhase === 'wiring' && currentStep < tutorialSteps.length) {
        speak(tutorialSteps[currentStep].text);
      } else if (currentPhase === 'cutting') {

    /* ================= Cutting Phase ================= */
    function startCuttingPhase() {
      currentPhase = 'cutting';
      cutStep = 1;
      workspace.classList.add('scissor-mode');

      wires.forEach(w => {
        if (!w.isError && w.type === 'neg' && (w.from === 'bat_neg' || w.to === 'bat_neg')) {
          w.element.classList.remove('locked');
          w.element.classList.add('cuttable');
          w.element.onclick = (e) => {
            e.stopPropagation();
            handleWireCut(w);
          };
        }
      });

      updateGuidanceUI();
    }

    function handleWireCut(wire) {
      if (currentPhase !== 'cutting') return;

      const targetMotorNode = (cutStep === 1) ? 'm2_neg' : 'm1_neg';
      const isTarget = (wire.from === targetMotorNode || wire.to === targetMotorNode);

      if (isTarget) {
        playSnipSound();
        removeWire(wire.id);
        cutStep++;

        if (cutStep > 2) {
          workspace.classList.remove('scissor-mode');
          setTimeout(startSwitchesPhase, 700);
        } else {
          updateGuidanceUI();
        }
      } else {
        playErrorSound();
        speak("Please cut the requested wire in order.");
      }
    }

    /* ================= Switches Phase ================= */
    function startSwitchesPhase() {
      currentPhase = 'switches';
      switchStep = 0;

      switches.sw1.wrap.style.display = 'flex';
      switches.sw2.wrap.style.display = 'flex';

      updateGuidanceUI();
    }

    ['sw1', 'sw2'].forEach(key => {
      const swObj = switches[key];
      swObj.box.addEventListener('click', (e) => {
        e.stopPropagation();
        playClickSound();
        swObj.closed = !swObj.closed;
        if (swObj.closed) {
          swObj.box.classList.add('closed');
        } else {
          swObj.box.classList.remove('closed');
        }
        checkCircuits();

        if (currentPhase === 'switches' && switchStep < switchWiringSteps.length) {
          const curStepObj = switchWiringSteps[switchStep];
          if (curStepObj.isToggle && curStepObj.swKey === key && swObj.closed) {
            playSuccessSound();
            switchStep++;
            setTimeout(updateGuidanceUI, 500);
          }
        }
      });
    });

    /* ================= Geometric Paths ================= */
    function generateGeometricPath(nodeA, nodeB) {
      const pA = getNodeCenter(nodeA);
      const pB = getNodeCenter(nodeB);

      const elA = document.getElementById(nodeA);
      const elB = document.getElementById(nodeB);
      const parentA = elA.dataset.parent;
      const parentB = elB.dataset.parent;

      // Self Loop: Motor
      if (parentA === parentB && parentA.startsWith('m')) {
        const midX = (parentA === 'm1') ? pA.x + 55 : pA.x - 55;
        return `M ${pA.x} ${pA.y} C ${midX} ${pA.y}, ${midX} ${pB.y}, ${pB.x} ${pB.y}`;
      }

      // Self Loop: Battery Short
      if (parentA === 'battery' && parentB === 'battery') {
        const sideX = Math.max(pA.x, pB.x) + 65;
        return `M ${pA.x} ${pA.y} C ${sideX} ${pA.y}, ${sideX} ${pB.y}, ${pB.x} ${pB.y}`;
      }

      // Self Loop: Switch Bypass
      if (parentA === parentB && parentA.startsWith('sw')) {
        const bottomY = Math.max(pA.y, pB.y) + 40;
        return `M ${pA.x} ${pA.y} C ${pA.x} ${bottomY}, ${pB.x} ${bottomY}, ${pB.x} ${pB.y}`;
      }

      // Smooth Bezier Curve
      const midY = (pA.y + pB.y) / 2;
      return `M ${pA.x} ${pA.y} C ${pA.x} ${midY}, ${pB.x} ${midY}, ${pB.x} ${pB.y}`;
    }

    /* ================= Node Clicking & Handling ================= */
    nodes.forEach(node => {
      node.addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();

        if (currentPhase === 'cutting') {
          speak("Use the scissors to cut the negative wires first.");
          return;
        }

        if (hasBlockingError) {
          playErrorSound();
          speak("You must delete the incorrect wire first. Click directly on the flashing wire to remove it.");
          return;
        }

        const nodeId = node.id;

        if (!selectedNode) {
          selectedNode = nodeId;
          node.classList.add('selected');
          const pol = node.dataset.polarity;
          tempLine.style.stroke = (pol === 'pos') ? 'var(--pos-color)' : 'var(--neg-color)';
        } else if (selectedNode === nodeId) {
          node.classList.remove('selected');
          selectedNode = null;
          tempLine.setAttribute('d', '');
        } else {
          const firstNode = selectedNode;
          const secondNode = nodeId;
          document.getElementById(firstNode).classList.remove('selected');
          selectedNode = null;
          tempLine.setAttribute('d', '');

          const el1 = document.getElementById(firstNode);
          const el2 = document.getElementById(secondNode);

          // Battery Short Circuit
          if (el1.dataset.parent === 'battery' && el2.dataset.parent === 'battery') {
            triggerErrorWire(firstNode, secondNode, 'battery');
            return;
          }

          // Same motor loop
          if (el1.dataset.parent === el2.dataset.parent && el1.dataset.parent.startsWith('m')) {
            triggerErrorWire(firstNode, secondNode, 'motor');
            return;
          }

          // Switch Bypass
          if (el1.dataset.parent === el2.dataset.parent && el1.dataset.parent.startsWith('sw')) {
            triggerErrorWire(firstNode, secondNode, 'switch_bypass');
            return;
          }

          // Phase 1 Check
          if (currentPhase === 'wiring') {
            const step = tutorialSteps[currentStep];
            const isCorrect = (firstNode === step.n1 && secondNode === step.n2) ||
                              (firstNode === step.n2 && secondNode === step.n1);

            if (isCorrect) {
              playSuccessSound();
              addWire(firstNode, secondNode, false);
              currentStep++;

              if (currentStep === 2) {
                speak("Great! Right motor is wired and turning the car. Now wire the left motor.");
              } else if (currentStep === 4) {
                speak("Awesome! Both motors are running straight.");
              }
              setTimeout(updateGuidanceUI, 400);
            } else {
              triggerErrorWire(firstNode, secondNode, 'wrong_step');
            }
          }
          // Phase 3 Check
          else if (currentPhase === 'switches') {
            const curStepObj = switchWiringSteps[switchStep];
            if (curStepObj && !curStepObj.isToggle) {
              const isCorrect = (firstNode === curStepObj.n1 && secondNode === curStepObj.n2) ||
                                (firstNode === curStepObj.n2 && secondNode === curStepObj.n1);

              if (isCorrect) {
                playSuccessSound();
                addWire(firstNode, secondNode, false);
                switchStep++;
                setTimeout(updateGuidanceUI, 400);
              } else {
                triggerErrorWire(firstNode, secondNode, 'wrong_step');
              }
            }
          }
        }
      });
    });

    function triggerErrorWire(nodeA, nodeB, errorType) {
      playErrorSound();
      hasBlockingError = true;
      arrow1.style.display = 'none';
      arrow2.style.display = 'none';
      document.querySelectorAll('.node').forEach(n => n.classList.remove('target-hint'));

      guidePanel.classList.add('error-state');
      guideAvatar.innerText = "⚠️";

      if (errorType === 'battery') {
        guideTitle.innerText = "🔥 DANGER: Battery Short Circuit!";
        guideDesc.innerText = "Click on the flashing wire to delete it and stop the alarm.";
        addWire(nodeA, nodeB, true, true, false, false);
        speak("Danger! Short circuit! You connected the battery terminals together. Click the flashing wire to remove it.");
      } else if (errorType === 'motor') {
        guideTitle.innerText = "🤔 Where is the energy?";
        guideDesc.innerText = "A motor cannot run itself without a power source! Click on the flashing wire to delete it.";
        addWire(nodeA, nodeB, true, false, true, false);
        speak("Where is the energy? A motor cannot run itself without a power source! Please click on the flashing wire to remove it.");
      } else if (errorType === 'switch_bypass') {
        guideTitle.innerText = "😅 You canceled me!";
        guideDesc.innerText = "The switch has been bypassed and has no control! Click the wire to remove it.";
        addWire(nodeA, nodeB, true, false, false, true);
        speak("You canceled me! The switch is bypassed and has no control. Click the flashing wire to remove it.");
      } else {
        guideTitle.innerText = "❌ Incorrect Wire Connected!";
        guideDesc.innerText = "This does not match the coach instructions. Click directly on this wire to remove it.";
        addWire(nodeA, nodeB, true, false, false, false);
        speak("Oops, that's not the requested connection. Please click on the flashing wire to delete it before continuing.");
      }
    }

    workspace.addEventListener('mousemove', (e) => {
      if (!selectedNode || hasBlockingError) return;
      const wsRect = workspace.getBoundingClientRect();
      const p1 = getNodeCenter(selectedNode);
      const curX = e.clientX - wsRect.left;
      const curY = e.clientY - wsRect.top;
      tempLine.setAttribute('d', `M ${p1.x} ${p1.y} L ${curX} ${curY}`);
    });

    workspace.addEventListener('click', () => {
      if (selectedNode) {
        document.getElementById(selectedNode).classList.remove('selected');
        selectedNode = null;
        tempLine.setAttribute('d', '');
      }
    });

    /* ================= Wire Management ================= */
    function addWire(nodeA, nodeB, isError = false, isBatteryShort = false, isMotorShort = false, isSwitchBypass = false) {
      const exists = wires.some(w => 
        (w.from === nodeA && w.to === nodeB) || (w.from === nodeB && w.to === nodeA)
      );
      if (exists) return;

      const elA = document.getElementById(nodeA);
      const elB = document.getElementById(nodeB);
      const isShort = (elA.dataset.parent === elB.dataset.parent);

      let wireType = 'pos';
      if (isError && !isShort) {
        wireType = 'wrong-step';
      } else if (isShort) {
        wireType = 'short';
      } else if (elA.dataset.polarity === 'neg' || elB.dataset.polarity === 'neg') {
        wireType = 'neg';
      }

      const lockClass = isError ? 'can-remove' : 'locked';

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', `wire-path ${wireType} ${lockClass}`);
      path.setAttribute('d', generateGeometricPath(nodeA, nodeB));

      const wireData = {
        id: 'wire_' + Date.now() + Math.random(),
        from: nodeA,
        to: nodeB,
        parentA: elA.dataset.parent,
        parentB: elB.dataset.parent,
        isShort: isShort,
        isError: isError,
        isBatteryShort: isBatteryShort,
        isMotorShort: isMotorShort,
        isSwitchBypass: isSwitchBypass,
        element: path,
        type: wireType
      };

      if (isError) {
        path.addEventListener('click', (e) => {
          e.stopPropagation();
          removeWire(wireData.id);
        });
      }

      wiresLayer.appendChild(path);
      wires.push(wireData);
      checkCircuits();
    }

    function removeWire(wireId) {
      const idx = wires.findIndex(w => w.id === wireId);
      if (idx !== -1) {
        const removedWire = wires[idx];
        removedWire.element.remove();
        wires.splice(idx, 1);

        if (removedWire.isError) {
          hasBlockingError = false;
          updateGuidanceUI();
        }

        checkCircuits();
      }
    }

    clearBtn.addEventListener('click', () => {
      wires.forEach(w => w.element.remove());
      wires = [];
      hasBlockingError = false;
      currentPhase = 'wiring';
      currentStep = 0;
      cutStep = 1;
      switchStep = 0;

      workspace.classList.remove('scissor-mode');
      switches.sw1.wrap.style.display = 'none';
      switches.sw2.wrap.style.display = 'none';
      switches.sw1.closed = false;
      switches.sw2.closed = false;
      switches.sw1.box.classList.remove('closed', 'bypassed');
      switches.sw2.box.classList.remove('closed', 'bypassed');

      ['sw1', 'sw2', 'm1', 'm2'].forEach(k => {
        const bubble = document.getElementById('bubble-' + k);
        if (bubble) bubble.classList.remove('show');
      });

      if (selectedNode) {
        document.getElementById(selectedNode).classList.remove('selected');
        selectedNode = null;
      }
      tempLine.setAttribute('d', '');
      updateGuidanceUI();
      checkCircuits();
    });

    /* ================= Circuit Graph & Evaluation ================= */
    function checkCircuits() {
      const graph = {};
      nodes.forEach(n => graph[n.id] = []);

      wires.forEach(w => {
        if (!w.isError) {
          graph[w.from].push(w.to);
          graph[w.to].push(w.from);
        }
      });

      ['sw1', 'sw2'].forEach(k => {
        const sw = switches[k];
        const isBypassed = wires.some(w => w.isSwitchBypass && w.parentA === k && w.parentB === k);
        if (sw.closed || isBypassed) {
          graph[sw.inNode].push(sw.outNode);
          graph[sw.outNode].push(sw.inNode);
        }
      });

      function getReachableNodes(startNode) {
        const visited = new Set();
        const queue = [startNode];
        visited.add(startNode);

        while (queue.length > 0) {
          const curr = queue.shift();
          for (const neighbor of graph[curr] || []) {
            if (!visited.has(neighbor)) {
              visited.add(neighbor);
              queue.push(neighbor);
            }
          }
        }
        return visited;
      }

      const posReachable = getReachableNodes('bat_pos');
      const negReachable = getReachableNodes('bat_neg');

      // Battery Short Circuit
      const isShortCircuited = posReachable.has('bat_neg') || wires.some(w => w.isBatteryShort);

      if (isShortCircuited) {
        batteryBody.classList.add('battery-burned');
        startAlarmSound();
      } else {
        batteryBody.classList.remove('battery-burned');
        stopAlarmSound();
      }

      // Motor Self Loop Bubbles
      ['m1', 'm2'].forEach(mKey => {
        const bubble = document.getElementById('bubble-' + mKey);
        const isSelfConnected = wires.some(w => w.isMotorShort && w.parentA === mKey && w.parentB === mKey);
        if (isSelfConnected) bubble.classList.add('show');
        else bubble.classList.remove('show');
      });

      // Switch Bypass Bubbles
      ['sw1', 'sw2'].forEach(swKey => {
        const swBubble = document.getElementById('bubble-' + swKey);
        const isBypassed = wires.some(w => w.isSwitchBypass && w.parentA === swKey && w.parentB === swKey);
        if (isBypassed) {
          if (swBubble) swBubble.classList.add('show');
          switches[swKey].box.classList.add('bypassed');
        } else {
          if (swBubble) swBubble.classList.remove('show');
          switches[swKey].box.classList.remove('bypassed');
        }
      });

      // Motor Active Status
      let m1Runs = false;
      let m2Runs = false;

      if (!isShortCircuited) {
        if (posReachable.has('m1_pos') && negReachable.has('m1_neg')) m1Runs = true;
        if (posReachable.has('m2_pos') && negReachable.has('m2_neg')) m2Runs = true;
      }

      // Wheel animations
      if (m1Runs) wheelLeft.classList.add('spinning');
      else wheelLeft.classList.remove('spinning');

      if (m2Runs) wheelRight.classList.add('spinning');
      else wheelRight.classList.remove('spinning');

      // Chassis car directional movements
      carChassis.classList.remove('moving-forward', 'turning-left', 'turning-right');

      if (m1Runs && m2Runs) {
        carChassis.classList.add('moving-forward');
      } else if (m1Runs && !m2Runs) {
        carChassis.classList.add('turning-right');
      } else if (!m1Runs && m2Runs) {
        carChassis.classList.add('turning-left');
      }
    }

    window.addEventListener('resize', () => {
      wires.forEach(w => {
        w.element.setAttribute('d', generateGeometricPath(w.from, w.to));
      });
      if (!hasBlockingError && currentPhase === 'wiring' && currentStep < tutorialSteps.length) {
        const step = tutorialSteps[currentStep];
        const p1 = getNodeCenter(step.n1);
        const p2 = getNodeCenter(step.n2);
        arrow1.style.left = (p1.x - 12) + 'px';
        arrow1.style.top = (p1.y - 32) + 'px';
        arrow2.style.left = (p2.x - 12) + 'px';
        arrow2.style.top = (p2.y - 32) + 'px';
      }
    });

    window.addEventListener('load', () => {
      updateGuidanceUI();
    });
  </script>
</body>
</html>
